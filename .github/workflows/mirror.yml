name: mirror

on:
  schedule:
    # hourly at minute 17 (UTC) — spread load away from the top of the hour
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch mirror
        run: node mirror.js

      - name: Commit and push
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — mirror is up to date."
          else
            git commit -m "Mirror refresh $(date -u +%FT%TZ)"
            git push
          fi
